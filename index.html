<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google AdSense -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9973236774766110"
        crossorigin="anonymous"></script>

    <title>The Bible Garden Puzzle</title>

    <style>
        /* === BOTANICAL SAGE GREEN STYLING === */
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #e8efe9 0%, #c8d6ca 100%);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
        }

        .game-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(44, 62, 41, 0.15);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #b2c4b5;
        }

        .stats-grid {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .nectar-display,
        .tier-display {
            font-size: 14px;
            font-weight: bold;
            color: #2e4a23;
            background: #f0f5f1;
            padding: 8px 14px;
            border-radius: 20px;
            flex: 1;
            text-align: center;
            border: 1px solid #e0e8e1;
        }

        .tier-display {
            background: #eef7f9;
            color: #1e3d59;
            border-color: #d2e5eb;
        }

        h1 {
            color: #2e4a23;
            margin: 10px 0 2px 0;
            font-size: 26px;
            font-weight: normal;
        }

        .subtitle {
            font-style: italic;
            color: #556b2f;
            margin: 0 0 20px 0;
            font-size: 14px;
        }

        .puzzle-box {
            background: #f4f7f4;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #e0e8e1;
        }

        .scrambled-word {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #3b5334;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            word-wrap: break-word;
        }

        .hint {
            font-size: 15px;
            color: #616e62;
            margin: 0;
            line-height: 1.4;
        }

        .hint span {
            font-weight: bold;
            color: #2e4a23;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            padding: 14px;
            font-size: 18px;
            border: 2px solid #c8d6ca;
            border-radius: 8px;
            outline: none;
            text-align: center;
            text-transform: uppercase;
            font-family: inherit;
            background-color: #fafdfa;
        }

        input[type="text"]:focus {
            border-color: #556b2f;
            background-color: #ffffff;
        }

        button.action-btn {
            padding: 14px;
            font-size: 16px;
            color: white;
            background: #465c32;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            font-family: sans-serif;
        }

        button.action-btn:hover {
            background: #354625;
        }

        .secondary-btn {
            background: #768f5c;
        }

        .secondary-btn:hover {
            background: #5d7347;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
            min-height: 24px;
        }

        .correct {
            color: #3b7a24;
        }

        .incorrect {
            color: #b23b3b;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="stats-grid">
            <div class="nectar-display">
                🌸 <span id="nectarPoints">0</span> Nectar Points
            </div>

            <div class="tier-display">
                🌱 Tier: <span id="gardenTier">Mustard Seed</span>
            </div>
        </div>

        <h1>The Bible Garden Puzzle</h1>
        <p class="subtitle">Vines & Verses</p>

        <div class="puzzle-box">
            <p class="scrambled-word" id="scrambledWord">_____</p>
            <p class="hint">
                Hint: <span id="wordHint">...</span>
            </p>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="Type your guess here"
                autocomplete="off"
            >

            <button id="checkBtn" class="action-btn">
                Check Word
            </button>

            <button id="refreshBtn" class="action-btn secondary-btn">
                Next Seed
            </button>
        </div>

        <p class="message" id="message"></p>
    </div>

    <script>
        // BIBLE WORDS DICTIONARY
        const bibleWordsBank = [
            {
                word: "myrrh",
                hint: "A valuable, aromatic resin offered to baby Jesus"
            },
            {
                word: "honey",
                hint: "Sweet substance found in the rock; part of John the Baptist's diet"
            },
            {
                word: "frankincense",
                hint: "A costly incense burned in priestly duties and given by the Wise Men"
            },
            {
                word: "cinnamon",
                hint: "A fragrant spice used in the sacred anointing oil"
            },
            {
                word: "tabernacle",
                hint: "The portable earthly dwelling place of God's presence"
            },
            {
                word: "candle",
                hint: "Used to give light to all who are in the house"
            },
            {
                word: "oil",
                hint: "Kept in jars by the wise virgins to keep their lamps burning"
            },
            {
                word: "lamp",
                hint: "Thy word is a _____ unto my feet"
            },
            {
                word: "shepherd",
                hint: "The Lord is my _____; I shall not want"
            }
        ];

        let currentSecretWord = "";
        let points = 0;

        // DOM ELEMENT ACCESS
        const scrambledWordEl = document.getElementById("scrambledWord");
        const wordHintEl = document.getElementById("wordHint");
        const userInputEl = document.getElementById("userInput");
        const checkBtn = document.getElementById("checkBtn");
        const refreshBtn = document.getElementById("refreshBtn");
        const messageEl = document.getElementById("message");
        const nectarPointsEl = document.getElementById("nectarPoints");
        const gardenTierEl = document.getElementById("gardenTier");

        // SCRAMBLE LOGIC
        function scrambleWord(word) {
            let letters = word.split("");

            for (let i = letters.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }

            if (letters.join("") === word) {
                return scrambleWord(word);
            }

            return letters.join("");
        }

        // TIER EVALUATION
        function updateTierBadge() {
            if (points >= 100) {
                gardenTierEl.innerText = "👑 Faithful";
            } else if (points >= 60) {
                gardenTierEl.innerText = "🌳 Sacred Oasis";
            } else if (points >= 30) {
                gardenTierEl.innerText = "🌿 Trailing Vines";
            } else {
                gardenTierEl.innerText = "🌱 Mustard Seed";
            }
        }

        // INITIALIZE ROUND
        function initGame() {
            messageEl.innerText = "";
            messageEl.className = "message";
            userInputEl.value = "";
            userInputEl.disabled = false;
            checkBtn.disabled = false;

            const randomObj =
                bibleWordsBank[
                    Math.floor(Math.random() * bibleWordsBank.length)
                ];

            currentSecretWord = randomObj.word.toLowerCase();
            scrambledWordEl.innerText = scrambleWord(currentSecretWord);
            wordHintEl.innerText = randomObj.hint;
        }

        // CHECK ANSWER LOGIC
        function checkAnswer() {
            const userGuess = userInputEl.value.trim().toLowerCase();

            if (!userGuess) {
                return;
            }

            if (userGuess === currentSecretWord) {
                messageEl.className = "message correct";
                messageEl.innerText =
                    "🌸 Correct! You've nurtured the seed.";

                points += 10;
                nectarPointsEl.innerText = points;
                updateTierBadge();

                userInputEl.disabled = true;
                checkBtn.disabled = true;
            } else {
                messageEl.className = "message incorrect";
                messageEl.innerText =
                    "❌ Try again! That's not quite right.";
            }
        }

        // EVENT LISTENERS
        checkBtn.addEventListener("click", checkAnswer);
        refreshBtn.addEventListener("click", initGame);

        userInputEl.addEventListener("keypress", function (event) {
            if (event.key === "Enter" && !checkBtn.disabled) {
                checkAnswer();
            }
        });

        // START THE GAME
        initGame();
    </script>
</body>
</html>
